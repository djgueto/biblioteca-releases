name: App de escritorio

# Con cada versión (tag v*) compila la app para Windows, macOS y Linux y la
# adjunta a la release de GitHub. También se puede lanzar a mano.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Biblioteca-windows
          - os: macos-latest
            artifact: Biblioteca-macos
          - os: ubuntu-22.04
            artifact: Biblioteca-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias de la bandeja del sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-1 gir1.2-ayatanaappindicator3-0.1
      - run: pip install -r requirements.txt -r packaging/desktop/requirements.txt
      - name: Grabar la versión en el paquete
        shell: bash
        run: echo "${{ github.ref_name }}" > VERSION
      - run: pyinstaller --noconfirm packaging/desktop/biblioteca.spec
      - name: Empaquetar
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent Biblioteca.app "../${{ matrix.artifact }}.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" Biblioteca
          else
            tar czf "../${{ matrix.artifact }}.tar.gz" Biblioteca
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  # Una sola publicación cuando han terminado los tres sistemas (si cada uno
  # la creara, las novedades se repetirían).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Novedades (commits desde la versión anterior)
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          git log --no-merges --pretty='- %s' "$range" > NOVEDADES.md
          cat NOVEDADES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: paquetes/*
          body_path: NOVEDADES.md  # las "novedades" que muestra el aviso de actualización
      # El código es privado: la app se actualiza desde un repositorio
      # público que solo tiene los instaladores (sin clave de GitHub en
      # cada equipo). RELEASES_TOKEN: clave con permiso de escritura allí.
      - uses: softprops/action-gh-release@v2
        if: env.RELEASES_TOKEN != ''
        with:
          repository: djgueto/biblioteca-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: paquetes/*
          body_path: NOVEDADES.md
