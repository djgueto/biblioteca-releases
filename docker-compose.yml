# Biblioteca en Docker (PC con Linux, Synology, QNAP, Unraid, TrueNAS...).
#
#   1. Cambia /ruta/a/tus/medios por la carpeta donde están tus series y
#      películas (dentro del contenedor se verá como /media).
#   2. docker compose up -d
#   3. Abre http://IP-DEL-EQUIPO:9797 y sigue el asistente: clave de TMDB y
#      carpetas de la biblioteca (elígelas dentro de /media).
#
# Toda la configuración, la base de datos y las cachés quedan en ./config.
# Para NAS con las bibliotecas en otro equipo por SMB, ver
# packaging/docker/docker-compose.nas-smb.yml.

services:
  biblioteca:
    image: ghcr.io/djgueto/biblioteca:latest
    # build: .                # o compilar la imagen desde este código
    container_name: biblioteca
    restart: unless-stopped
    ports:
      - "9797:9797"
    shm_size: "1gb"            # Chromium necesita más /dev/shm que los 64 MB por defecto
    environment:
      TZ: Europe/Madrid
      PUID: "1000"             # usuario y grupo dueños de tus medios (en Synology: id del usuario)
      PGID: "1000"
    volumes:
      - ./config:/config
      - /ruta/a/tus/medios:/media
      # Carpeta que vigila tu cliente torrent, si está en otro contenedor:
      # - /ruta/a/watch:/watch
